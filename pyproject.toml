[project]
name = "tile-twinx"
version = "1.0.0"
description = "Split a raw YouTube title into artist, title and extras."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.8.19",
]

keywords = [
    "youtube", "title", "parser", "metadata", "music", "artist", "tags",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["assets", "Tile"]

[tool.hatch.build.targets.wheel.sources]
"assets" = "Tile/assets"

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "Tile/main.py"

[tool.hatch.build.targets.sdist]
only-include = ["main.py", "app.py", "assets", "Tile", "README.md"]
